
name: Build and push ITFlow image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker build/**"
      - ".github/workflows/build-image.yml"

permissions:
  contents: read
  packages: write

env:
  # ghcr.io image names must be all lowercase
  IMAGE: ghcr.io/dt3233/itflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Short commit ID for the image tag
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (linux/amd64) and push
        uses: docker/build-push-action@v6
        with:
          context: "docker build"
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/DT3233/ITFlow_Docker_MicroVM

      - name: Show the image reference to use in DigitalOcean
        run: echo "Use this in the MicroVM create form -> ${IMAGE}:${SHORT_SHA}"
