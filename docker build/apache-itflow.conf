<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/itflow

    <Directory /var/www/itflow>
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve the git metadata
    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
